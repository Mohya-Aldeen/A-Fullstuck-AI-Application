# Used when Railway's config-file path points here.
# Root Directory must be backend/. Railpack also reads railpack.json and main.py
# in this folder, because a monorepo often does not apply this file.

[build]
builder = "RAILPACK"

[deploy]
# Apply schema changes before the new process accepts traffic.
preDeployCommand = "uv run python -m alembic upgrade head"
startCommand = "uv run python -m app.main"
healthcheckPath = "/health"
healthcheckTimeout = 120
