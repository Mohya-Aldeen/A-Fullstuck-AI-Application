[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "docling==2.125.0",
    "docling-core[chunking-openai]==2.94.1",
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "openai==3.3.0",
    "pgvector==0.5.0",
    "psycopg2-binary==2.9.11",
    "pydantic==2.13.4",
    "pydantic-ai==2.32.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn[standard]==0.52.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require local corpus files or live services",
]
